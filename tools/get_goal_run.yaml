identity:
  name: get_goal_run
  author: derekwang2002
  label:
    en_US: Get CALL-E Goal Run
description:
  human:
    en_US: Fetch one CALL-E Goal Run and its current structured result or final error.
  llm: Read a Goal Run using GET /v1/goals/{goal_id}/runs/{goal_run_id}. Wait while result_status is pending; unavailable is final even with null result and error. This read does not start a call.
parameters:
  - name: goal_id
    type: string
    required: true
    form: llm
    label:
      en_US: Goal ID
    human_description:
      en_US: Goal ID used when creating the Run.
  - name: goal_run_id
    type: string
    required: true
    form: llm
    label:
      en_US: Goal Run ID
    human_description:
      en_US: API GoalRun.id returned at creation, not run_id or call_id.
extra:
  python:
    source: tools/get_goal_run.py
output_schema:
  type: object
