identity:
  name: list_goals
  author: derekwang2002
  label:
    en_US: List CALL-E Goals
description:
  human:
    en_US: List published CALL-E Goals available to this API key.
  llm: Read CALL-E Goals using GET /v1/goals. This operation does not create a phone call.
parameters:
  - name: after
    type: string
    required: false
    form: llm
    label:
      en_US: After
    human_description:
      en_US: Opaque next_cursor from the previous page, passed unchanged.
    llm_description: Pass the previous next_cursor unchanged as after. Do not construct a cursor from a Goal ID.
  - name: limit
    type: number
    required: false
    default: 50
    form: llm
    label:
      en_US: Limit
    human_description:
      en_US: Page size from 1 to 100.
    llm_description: Page size from 1 to 100.
extra:
  python:
    source: tools/list_goals.py
output_schema:
  type: object
