identity:
  name: get_call
  author: derekwang2002
  label:
    en_US: Get CALL-E Call
description:
  human:
    en_US: Fetch one Calls API v2 resource by its API ID.
  llm: Fetch GET /v2/calls/{id} and return result_status, call_outcome, result, error, transcript, metadata, and redacted raw fields. Use the API resource ID, not the Billing call ID. Legacy IDs require the original interface.
parameters:
  - name: call_id
    type: string
    required: true
    form: llm
    label:
      en_US: Call ID
    human_description:
      en_US: API resource ID returned as call_id by this plugin's create tools, not the Billing ID.
    llm_description: API resource ID returned as call_id by create_call or create_and_wait. Do not use billing_call_id or a legacy v1 ID.
extra:
  python:
    source: tools/get_call.py
output_schema:
  type: object
  properties:
    call_id:
      type: string
    call_status:
      type: string
    billing_call_id:
      type: [string, "null"]
    call_outcome:
      type: [string, "null"]
    result_status:
      type: string
    error:
      type: [object, "null"]
      properties:
        code:
          type: string
        message:
          type: string
    summary:
      type: [string, "null"]
    transcript:
      type: array
    structured_result: &business_result
      type: [object, "null"]
      description: Business fields from the requested result schema, or null when unavailable.
      additionalProperties: true
      properties:
        summary:
          type: string
        call_completed:
          type: string
        outcome:
          type: string
        next_action:
          type: string
    result: *business_result
