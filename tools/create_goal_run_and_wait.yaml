identity:
  name: create_goal_run_and_wait
  author: derekwang2002
  label:
    en_US: Create And Wait For CALL-E Goal Run
description:
  human:
    en_US: Preview or create one CALL-E Goal Run, then wait for its structured result or final error.
  llm: Preview or create and wait for one Goal Run. It polls until result or error is non-null, because completed alone can still mean result processing. Live calls require dry_run=false and confirm_live_call=true.
parameters:
  - name: goal_id
    type: string
    required: true
    form: llm
    label:
      en_US: Goal ID
    human_description:
      en_US: ID of the published CALL-E Goal to run.
  - name: phone_number
    type: string
    required: true
    form: llm
    label:
      en_US: Phone Number
    human_description:
      en_US: Authorized recipient phone number in E.164 format.
  - name: idempotency_key
    type: string
    required: true
    form: llm
    label:
      en_US: Idempotency Key
    human_description:
      en_US: Stable key for one logical Goal Run; reuse it only when retrying the same request.
  - name: variables_json
    type: string
    required: false
    form: llm
    label:
      en_US: Variables JSON
    human_description:
      en_US: Optional flat JSON object containing string, number, or boolean Goal variables.
  - name: dry_run
    type: boolean
    required: false
    default: true
    form: llm
    label:
      en_US: Dry Run
    human_description:
      en_US: When true, validates and previews the request without creating a Goal Run.
  - name: confirm_live_call
    type: boolean
    required: false
    default: false
    form: llm
    label:
      en_US: Confirm Live Call
    human_description:
      en_US: Must be true with Dry Run disabled before a Goal Run can create a live phone call.
  - name: poll_interval_seconds
    type: number
    required: false
    default: 5
    form: llm
    label:
      en_US: Poll Interval Seconds
    human_description:
      en_US: Number of seconds to wait between Goal Run status checks.
  - name: wait_timeout_minutes
    type: number
    required: false
    default: 15
    form: llm
    label:
      en_US: Wait Timeout Minutes
    human_description:
      en_US: Maximum number of minutes to wait for a Goal Run result or error.
extra:
  python:
    source: tools/create_goal_run_and_wait.py
output_schema:
  type: object
