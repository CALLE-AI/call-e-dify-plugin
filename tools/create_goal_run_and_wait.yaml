identity:
  name: create_goal_run_and_wait
  author: derekwang2002
  label:
    en_US: Create And Wait For CALL-E Goal Run
description:
  human:
    en_US: Preview or create one CALL-E Goal Run, then wait until its result is final or the wait times out.
  llm: Preview or create and wait for one Goal Run. Poll while result_status is pending; unavailable and not_applicable are final even with null result and error. Live calls require dry_run=false and confirm_live_call=true.
parameters:
  - name: goal_id
    type: string
    required: true
    form: llm
    label:
      en_US: Goal ID
    human_description:
      en_US: ID of the published Goal to execute.
  - name: phone_number
    type: string
    required: true
    form: llm
    label:
      en_US: Phone Number
    human_description:
      en_US: Authorized recipient in E.164 format; sent as phone to the API.
  - name: idempotency_key
    type: string
    required: true
    form: llm
    label:
      en_US: Idempotency Key
    human_description:
      en_US: Stable business key for one Goal Run, saved before submission.
    llm_description: Required 1-255 printable ASCII characters. Retry only with the original key and unchanged inputs.
  - name: variables_json
    type: string
    required: false
    form: llm
    label:
      en_US: Variables JSON
    human_description:
      en_US: Flat JSON object matching the published Goal input schema.
    llm_description: Optional flat JSON object of finite string, number, or boolean Goal variables.
  - name: dry_run
    type: boolean
    required: false
    default: true
    form: llm
    label:
      en_US: Dry Run
    human_description:
      en_US: Preview without creating a live call.
  - name: confirm_live_call
    type: boolean
    required: false
    default: false
    form: llm
    label:
      en_US: Confirm Live Call
    human_description:
      en_US: Must be true with dry_run=false to create a live call.
  - name: poll_interval_seconds
    type: number
    required: false
    default: 5
    form: llm
    label:
      en_US: Poll Interval Seconds
    human_description:
      en_US: Seconds between lookups, clamped between 1 and 60.
  - name: wait_timeout_minutes
    type: number
    required: false
    default: 15
    form: llm
    label:
      en_US: Wait Timeout Minutes
    human_description:
      en_US: Maximum wait in minutes, clamped between 1 and 60. A timeout does not cancel the call.
extra:
  python:
    source: tools/create_goal_run_and_wait.py
output_schema:
  type: object
